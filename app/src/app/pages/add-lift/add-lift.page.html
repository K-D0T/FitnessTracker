<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="'/workouts/' + workoutId()"></ion-back-button>
    </ion-buttons>
    <ion-title>Add lift</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="save()">
    <ion-list>
      <ion-item>
        <ion-input
          formControlName="name"
          label="Lift"
          labelPlacement="floating"
          placeholder="Bench Press"
          autocapitalize="words"
        ></ion-input>
      </ion-item>
    </ion-list>

    <h3>Sets</h3>
    <ion-list formArrayName="sets">
      @for (group of sets.controls; track $index; let i = $index) {
        <ion-item [formGroupName]="i">
          <ion-input
            formControlName="reps"
            label="Reps"
            labelPlacement="stacked"
            type="number"
            inputmode="numeric"
            min="1"
          ></ion-input>
          <ion-input
            formControlName="weight"
            label="Weight"
            labelPlacement="stacked"
            type="number"
            inputmode="decimal"
            min="0"
          ></ion-input>
          <ion-button
            slot="end"
            fill="clear"
            color="medium"
            type="button"
            (click)="removeSet(i)"
            [attr.aria-label]="'Remove set ' + (i + 1)"
          >
            <ion-icon name="close-circle-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-item>
      }
    </ion-list>

    <ion-button type="button" expand="block" fill="outline" (click)="addSet()">
      Add another set
    </ion-button>

    @if (error()) {
      <ion-note color="danger">{{ error() }}</ion-note>
    }

    <ion-button type="submit" expand="block" [disabled]="busy()">
      @if (busy()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Save lift
      }
    </ion-button>
  </form>
</ion-content>
